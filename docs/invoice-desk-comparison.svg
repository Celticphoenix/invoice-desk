<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title description">
  <title id="title">FreshBooks plans and Invoice Desk comparison</title>
  <description id="description">A focused comparison of FreshBooks Lite, Plus, and Premium with the free open-source Invoice Desk.</description>
  <style>
    text { font-family: Inter, Arial, sans-serif; fill: #10221c; }
    .eyebrow { font-size: 18px; font-weight: 800; letter-spacing: 3px; fill: #147555; }
    .title { font-family: Georgia, serif; font-size: 55px; font-weight: 700; }
    .subtitle { font-size: 23px; fill: #4a5b55; }
    .head { font-size: 23px; font-weight: 800; }
    .price { font-size: 30px; font-weight: 900; }
    .feature { font-size: 20px; font-weight: 750; }
    .cell { font-size: 19px; font-weight: 600; }
    .small { font-size: 15px; fill: #5b6a65; }
    .ours { fill: #ffffff; }
    .yes { fill: #147555; font-size: 25px; font-weight: 900; }
    .no { fill: #7c8984; font-size: 18px; font-weight: 700; }
  </style>
  <rect width="1200" height="1200" fill="#f4f7f3"/>
  <rect x="0" y="0" width="1200" height="14" fill="#147555"/>
  <text x="60" y="70" class="eyebrow">A DIFFERENT KIND OF INVOICING TOOL</text>
  <text x="60" y="140" class="title">Focused invoicing. No monthly bill.</text>
  <text x="60" y="185" class="subtitle">FreshBooks does much more. Invoice Desk is deliberately smaller, free and self-hosted.</text>

  <rect x="45" y="230" width="1110" height="770" rx="18" fill="#ffffff" stroke="#cad6d0" stroke-width="2"/>
  <rect x="878" y="230" width="277" height="770" rx="18" fill="#e7f3ed"/>
  <rect x="878" y="230" width="277" height="145" rx="18" fill="#147555"/>
  <rect x="878" y="345" width="277" height="30" fill="#147555"/>

  <text x="69" y="284" class="small" style="font-weight:800;letter-spacing:1.5px">ESSENTIALS</text>
  <text x="420" y="282" text-anchor="middle" class="head">Lite</text>
  <text x="606" y="282" text-anchor="middle" class="head">Plus</text>
  <text x="789" y="282" text-anchor="middle" class="head" visibility="hidden">Spacer</text>
  <text x="789" y="322" text-anchor="middle" class="price" visibility="hidden">Spacer</text>
  <text x="782" y="282" text-anchor="middle" class="head">Premium</text>
  <text x="972" y="276" text-anchor="middle" class="ours" style="font-size:25px;font-weight:900">Invoice Desk</text>
  <text x="972" y="322" text-anchor="middle" class="ours" style="font-size:34px;font-weight:900">FREE</text>
  <text x="972" y="350" text-anchor="middle" class="ours" style="font-size:16px;font-weight:700">OPEN SOURCE · MIT</text>
  <text x="420" y="331" text-anchor="middle" class="price">$26</text>
  <text x="606" y="331" text-anchor="middle" class="price">$42</text>
  <text x="782" y="331" text-anchor="middle" class="price">$72</text>
  <text x="420" y="354" text-anchor="middle" class="small">CAD / month</text>
  <text x="606" y="354" text-anchor="middle" class="small">CAD / month</text>
  <text x="782" y="354" text-anchor="middle" class="small">CAD / month</text>

  <g stroke="#dfe7e2" stroke-width="2">
    <line x1="45" y1="375" x2="1155" y2="375"/>
    <line x1="45" y1="453" x2="1155" y2="453"/>
    <line x1="45" y1="531" x2="1155" y2="531"/>
    <line x1="45" y1="609" x2="1155" y2="609"/>
    <line x1="45" y1="687" x2="1155" y2="687"/>
    <line x1="45" y1="765" x2="1155" y2="765"/>
    <line x1="45" y1="843" x2="1155" y2="843"/>
    <line x1="45" y1="921" x2="1155" y2="921"/>
    <line x1="330" y1="230" x2="330" y2="1000"/>
    <line x1="512" y1="230" x2="512" y2="1000"/>
    <line x1="700" y1="230" x2="700" y2="1000"/>
    <line x1="878" y1="375" x2="878" y2="1000" opacity="0"/>
  </g>

  <text x="69" y="419" class="feature">Billable clients</text>
  <text x="420" y="419" text-anchor="middle" class="cell">5</text>
  <text x="606" y="419" text-anchor="middle" class="cell">50</text>
  <text x="782" y="419" text-anchor="middle" class="cell">Unlimited</text>
  <text x="972" y="419" text-anchor="middle" class="yes">✓ Unlimited</text>

  <text x="69" y="497" class="feature">Send invoices</text>
  <text x="420" y="497" text-anchor="middle" class="yes">✓</text>
  <text x="606" y="497" text-anchor="middle" class="yes">✓</text>
  <text x="782" y="497" text-anchor="middle" class="yes">✓</text>
  <text x="972" y="485" text-anchor="middle" class="yes">✓</text>
  <text x="972" y="511" text-anchor="middle" class="cell">Gmail send-only</text>

  <text x="69" y="575" class="feature">Built-in client campaigns</text>
  <text x="420" y="575" text-anchor="middle" class="no">Via integration*</text>
  <text x="606" y="575" text-anchor="middle" class="no">Via integration*</text>
  <text x="782" y="575" text-anchor="middle" class="no">Via integration*</text>
  <text x="972" y="563" text-anchor="middle" class="yes">✓</text>
  <text x="972" y="589" text-anchor="middle" class="cell">Consent-aware</text>

  <text x="69" y="653" class="feature">Online card payments</text>
  <text x="420" y="653" text-anchor="middle" class="yes">✓</text>
  <text x="606" y="653" text-anchor="middle" class="yes">✓</text>
  <text x="782" y="653" text-anchor="middle" class="yes">✓</text>
  <text x="972" y="641" text-anchor="middle" class="yes">✓</text>
  <text x="972" y="667" text-anchor="middle" class="cell">Stripe Checkout</text>

  <text x="69" y="731" class="feature">Accountant handoff</text>
  <text x="420" y="721" text-anchor="middle" class="cell">Tax-time</text>
  <text x="420" y="746" text-anchor="middle" class="cell">reports</text>
  <text x="606" y="721" text-anchor="middle" class="cell">Accountant</text>
  <text x="606" y="746" text-anchor="middle" class="cell">access</text>
  <text x="782" y="721" text-anchor="middle" class="cell">Accountant</text>
  <text x="782" y="746" text-anchor="middle" class="cell">access</text>
  <text x="972" y="719" text-anchor="middle" class="yes">✓</text>
  <text x="972" y="745" text-anchor="middle" class="cell">Monthly ZIP</text>

  <text x="69" y="809" class="feature">Expense tracking</text>
  <text x="420" y="809" text-anchor="middle" class="yes">✓</text>
  <text x="606" y="809" text-anchor="middle" class="yes">✓</text>
  <text x="782" y="809" text-anchor="middle" class="yes">✓</text>
  <text x="972" y="809" text-anchor="middle" class="no">Not included</text>

  <text x="69" y="887" class="feature">Deployment</text>
  <text x="420" y="887" text-anchor="middle" class="cell">FreshBooks cloud</text>
  <text x="606" y="887" text-anchor="middle" class="cell">FreshBooks cloud</text>
  <text x="782" y="887" text-anchor="middle" class="cell">FreshBooks cloud</text>
  <text x="972" y="875" text-anchor="middle" class="yes">✓</text>
  <text x="972" y="901" text-anchor="middle" class="cell">Self-hosted</text>

  <text x="69" y="965" class="feature">Code you can modify</text>
  <text x="420" y="965" text-anchor="middle" class="no">—</text>
  <text x="606" y="965" text-anchor="middle" class="no">—</text>
  <text x="782" y="965" text-anchor="middle" class="no">—</text>
  <text x="972" y="953" text-anchor="middle" class="yes">✓</text>
  <text x="972" y="979" text-anchor="middle" class="cell">MIT licensed</text>

  <rect x="60" y="1025" width="1080" height="72" rx="16" fill="#102f27"/>
  <text x="90" y="1056" class="ours" style="font-size:19px;font-weight:800">Invoice Desk is focused invoicing—not full accounting software.</text>
  <text x="90" y="1082" class="ours" style="font-size:17px">github.com/Celticphoenix/invoice-desk</text>
  <text x="60" y="1125" class="small" style="font-size:13px">*FreshBooks supports marketing workflows through integrations such as HubSpot; this is not shown as a native plan feature.</text>
  <text x="60" y="1150" class="small" style="font-size:13px">Regular FreshBooks monthly prices and plan details checked Sept. 14, 2026; promotions may change.</text>
  <text x="60" y="1175" class="small" style="font-size:13px">FreshBooks is a trademark of its owner. Invoice Desk is independent and not affiliated with FreshBooks.</text>
</svg>
