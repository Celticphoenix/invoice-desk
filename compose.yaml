services:
  invoice-desk:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3210:3210"
    environment:
      NODE_ENV: production
      INVOICE_DESK_HOST: 0.0.0.0
      INVOICE_DESK_PASSWORD: ${INVOICE_DESK_PASSWORD:?Set INVOICE_DESK_PASSWORD in .env}
      INVOICE_DESK_SESSION_SECRET: ${INVOICE_DESK_SESSION_SECRET:?Set INVOICE_DESK_SESSION_SECRET in .env}
      INVOICE_DESK_SECURE_COOKIES: ${INVOICE_DESK_SECURE_COOKIES:-false}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_SUCCESS_URL: ${STRIPE_SUCCESS_URL:-}
      STRIPE_CANCEL_URL: ${STRIPE_CANCEL_URL:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    volumes:
      - invoice-desk-data:/app/data
    read_only: true
    tmpfs:
      - /tmp

volumes:
  invoice-desk-data:
